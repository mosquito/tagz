[project]
name = "tagz"
version = "0.8.0"
description = "A lightweight, type-safe Python library for building and parsing HTML documents programmatically without templates"
authors = [{ name = "Dmitry Orlov", email = "orlovdl@gmail.com" }]
requires-python = ">=3.10,<4"
readme = "README.md"
license = { text = "MIT" }
keywords = [
    "html",
    "builder",
    "parser",
    "template",
    "generator",
    "markup",
    "dom",
    "type-safe",
    "streaming",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mosquito/tagz"
Repository = "https://github.com/mosquito/tagz"
Documentation = "https://mosquito.github.io/tagz/"
"Bug Tracker" = "https://github.com/mosquito/tagz/issues"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "coveralls",
    "markdown-pytest",
    "pytest-benchmark",
    # Used by docs/how-to/htmx-with-aiohttp.md code blocks executed via markdown-pytest.
    "aiohttp",
]
docs = [
    "sphinx>=7",
    "furo>=2024.8",
    "myst-parser>=4",
    "sphinx-autodoc-typehints>=2",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
    "sphinx-autobuild>=2024.10",
    "sphinxcontrib-mermaid>=1",
]

[tool.pytest.ini_options]
testpaths = ["tests", "README.md", "docs"]

[tool.ruff]
target-version = "py310"
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "UP"]

[tool.hatch.build.targets.sdist]
include = ["tagz"]

[tool.hatch.build.targets.wheel]
include = ["tagz"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = false
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
follow_imports = "silent"
no_implicit_reexport = true
strict_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
files = [
    "tagz",
]
